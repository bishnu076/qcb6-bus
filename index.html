function csvURL(gid){ return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`; }

/* ===== UTILS ===== */
function today(){return new Date().toISOString().slice(0,10);}
function todayLbl(){return new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function set(p){Object.assign(S,p);render();}
function getStn(code){return S.data.stations.find(s=>s.code===code)||{code,name:'Station '+code,seat_limit:20};}
function getStaff(id){return S.data.staff.find(s=>s.id===id);}
function getRosterStn(staffId){const r=S.data.roster.find(r=>r.staff_id===staffId);return r?r.station_code:null;}
function getCI(staffId){return S.data.checkins.find(c=>c.staff_id===staffId);}
function stnRoster(code){return S.data.roster.filter(r=>r.station_code===code).map(r=>r.staff_id);}
function stnCI(code){return S.data.checkins.filter(c=>c.station_code===code).map(c=>c.staff_id);}
function stnCfg(code){return STN[code]||STN.A;}

function toast(msg,ms=3000){
  if(S.toastTimer)clearTimeout(S.toastTimer);
  S.toast=msg;
  S.toastTimer=setTimeout(()=>{S.toast='';render();},ms);
  render();
}

/* ===== DATA ===== */
async function reloadCI(){const{data}=await sb.from('checkins').select('*').eq('shift_date',today());S.data.checkins=data||[];}
async function reloadRoster(){const{data}=await sb.from('roster').select('*').eq('shift_date',today());S.data.roster=data||[];}
async function reloadStaff(){const{data}=await sb.from('staff').select('*').order('real_name');S.data.staff=data||[];}

async function loadAll(){
  S.screen='loading';render();
  try{
    const[st,sf,ro,ci]=await Promise.all([
      sb.from('stations').select('*').order('code'),
      sb.from('staff').select('*').order('real_name'),
      sb.from('roster').select('*').eq('shift_date',today()),
      sb.from('checkins').select('*').eq('shift_date',today())
    ]);
    S.data.stations=st.data||[];
    S.data.staff=sf.data||[];
    S.data.roster=ro.data||[];
    S.data.checkins=ci.data||[];
    S.screen='home';
  }catch(e){S.screen='error';}
  render();
  subscribe();
}

function subscribe(){
  sb.channel('qcb6_live')
    .on('postgres_changes',{event:'*',schema:'public',table:'checkins'},async()=>{await reloadCI();render();})
    .on('postgres_changes',{event:'*',schema:'public',table:'roster'},async()=>{await reloadRoster();render();})
    .on('postgres_changes',{event:'*',schema:'public',table:'staff'},async()=>{await reloadStaff();render();})
    .subscribe();
}

/* ===== GOOGLE SHEETS SYNC ===== */
async function syncFromSheets(){
  S.syncing=true;toast('📥 Syncing from Google Sheets...',15000);render();
  try{
    let totalAdded=0,totalRoster=0;

    // Clear today's roster first
    const oldRIds=S.data.roster.map(r=>r.id);
    if(oldRIds.length>0)await sb.from('roster').delete().in('id',oldRIds);
    S.data.roster=[];

    for(const code of CODES){
      const cfg=STN[code];
      // Fetch tab CSV (no header — just names in column A)
      const res=await fetch(csvURL(cfg.gid));
      const text=await res.text();
      const parsed=Papa.parse(text.replace(/^\uFEFF/,''),{header:false,skipEmptyLines:true});
      const names=parsed.data
        .map(row=>(row[0]||'').replace(/^"|"$/g,'').trim())
        .filter(n=>n&&n.length>1);

      for(const name of names){
        // Find or create staff by real_name
        let member=S.data.staff.find(s=>s.real_name.toUpperCase()===name.toUpperCase());
        if(!member){
          const maxB=S.data.staff.reduce((m,s)=>Math.max(m,s.badge_number),0);
          const{data,error}=await sb.from('staff')
            .insert({badge_number:maxB+1,real_name:name,facebook_name:''})
            .select().single();
          if(!error&&data){S.data.staff.push(data);member=data;totalAdded++;}
          else continue;
        }
        // Add to today's roster for this station
        const{data:rData}=await sb.from('roster')
          .insert({shift_date:today(),staff_id:member.id,station_code:code})
          .select().single();
        if(rData){S.data.roster.push(rData);totalRoster++;}
      }
    }

    await reloadStaff();
    S.lastSync=new Date().toLocaleTimeString();
    toast(`✅ Synced! ${totalRoster} staff loaded across 3 stations`,4000);
  }catch(e){
    toast('❌ Sync failed — check sheet is public viewer: '+e.message,6000);
  }
  S.syncing=false;render();
}

/* ===== PUSH TO SHEETS ===== */
async function pushToSheets(){
  S.pushing=true;toast('📤 Pushing report to Google Sheets...',10000);render();
  try{
    const boardingLog=S.data.checkins.map(ci=>{
      const m=getStaff(ci.staff_id),stn=getStn(ci.station_code);
      return{realName:m?.real_name||'',facebook:m?.facebook_name||'',station:stn.name,time:new Date(ci.checked_in_at).toLocaleTimeString()};
    });
    const exceptions=[];
    CODES.forEach(s=>{
      const rIds=stnRoster(s),ciIds=stnCI(s);
      rIds.filter(id=>!ciIds.includes(id)).forEach(id=>{
        const m=getStaff(id),ci=getCI(id);
        exceptions.push({realName:m?.real_name||'',facebook:m?.facebook_name||'',assigned:getStn(s).name,boardedAt:ci?getStn(ci.station_code).name:'',type:ci?'Wrong Station':'No Show'});
      });
    });
    const summary={
      aB:stnCI('A').length,aA:stnRoster('A').length,
      bB:stnCI('B').length,bA:stnRoster('B').length,
      cB:stnCI('C').length,cA:stnRoster('C').length,
      total:S.data.checkins.length,
      wrong:exceptions.filter(e=>e.type==='Wrong Station').length,
      noShow:exceptions.filter(e=>e.type==='No Show').length
    };
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'push_report',date:today(),boardingLog,exceptions,summary})});
    toast('✅ Report pushed to Google Sheets!',4000);
  }catch(e){toast('❌ Push failed: '+e.message,5000);}
  S.pushing=false;render();
}

/* ===== ACTIONS ===== */
async function doCheckIn(stnCode,staffId){
  const ex=S.data.checkins.find(c=>c.staff_id===staffId);
  if(ex){
    await sb.from('checkins').delete().eq('id',ex.id);
    S.data.checkins=S.data.checkins.filter(c=>c.id!==ex.id);
  }else{
    const{data}=await sb.from('checkins').insert({shift_date:today(),staff_id:staffId,station_code:stnCode}).select().single();
    if(data)S.data.checkins.push(data);
  }
  S.boardSrch='';render();
}
async function overrideCheckIn(stnCode,staffId,name){
  if(!confirm('Allow '+name+' to board here as an exception?'))return;
  await doCheckIn(stnCode,staffId);
}
async function resetCI(stnCode){
  const stn=getStn(stnCode);
  if(!confirm(stn.name+' のチェックインをリセットしますか？'))return;
  const ids=S.data.checkins.filter(c=>c.station_code===stnCode).map(c=>c.id);
  if(ids.length>0)await sb.from('checkins').delete().in('id',ids);
  S.data.checkins=S.data.checkins.filter(c=>c.station_code!==stnCode);
  render();
}
async function updateStn(code){
  const n=document.getElementById('sn'+code),l=document.getElementById('sl'+code);
  if(!n||!l)return;
  await sb.from('stations').update({name:n.value,seat_limit:parseInt(l.value)||20}).eq('code',code);
  const idx=S.data.stations.findIndex(s=>s.code===code);
  if(idx>=0)S.data.stations[idx]={...S.data.stations[idx],name:n.value,seat_limit:parseInt(l.value)||20};
  toast('✅ Saved',1500);render();
}
async function saveEdit(){
  const rn=S.editRN.trim(),fb=S.editFB.trim();if(!rn)return;
  await sb.from('staff').update({real_name:rn,facebook_name:fb}).eq('id',S.editId);
  const idx=S.data.staff.findIndex(s=>s.id===S.editId);
  if(idx>=0)S.data.staff[idx]={...S.data.staff[idx],real_name:rn,facebook_name:fb};
  S.editId=null;render();
}
async function removeStaff(id){
  if(!confirm('Remove this staff member?'))return;
  await sb.from('staff').delete().eq('id',id);
  S.data.staff=S.data.staff.filter(s=>s.id!==id);
  S.data.roster=S.data.roster.filter(r=>r.staff_id!==id);
  S.data.checkins=S.data.checkins.filter(c=>c.staff_id!==id);
  render();
}

function exportCSV(){
  let rows=['Real Name,Facebook Name,Assigned Station,Boarded,Boarded At,Time'];
  S.data.staff.forEach(m=>{
    const a=getRosterStn(m.id),ci=getCI(m.id);
    rows.push([m.real_name,m.facebook_name||'',a?getStn(a).name:'Not assigned',ci?'YES':'NO',ci?getStn(ci.station_code).name:'',ci?new Date(ci.checked_in_at).toLocaleTimeString():''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='QCB6_'+today()+'.csv';a.click();
}

          <div style="font-size:11px;color:#A0650A;font-weight:700;margin-bottom:3px">⚠️ 別のステーションで乗車済み</div>
          <div style="font-size:20px;font-weight:700;color:#1a1a1a">${esc(m.real_name)}</div>
          <div style="font-size:12px;color:#A0650A;margin-top:3px">→ ${wCfg.emoji} ${esc(getStn(exCI.station_code).name)}</div>
        </div>`;
      }else if(wrongStn){
        const oCfg=STN[assignedTo];
        h+=`<div style="background:#FFF8E6;border:1.5px solid #F5A623;border-radius:10px;padding:12px 14px;margin-bottom:8px">
          <div style="font-size:11px;color:#A0650A;font-weight:700;margin-bottom:3px">⚠️ 別ステーション割り当て</div>
          <div style="font-size:20px;font-weight:700;color:#1a1a1a">${esc(m.real_name)}</div>

          <button onclick="overrideCheckIn('${code}',${m.id},'${m.real_name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")} ')" style="margin-top:8px;width:100%;padding:9px;border-radius:8px;border:1.5px solid #F5A623;background:#FFF8E6;font-size:13px;color:#A0650A;font-weight:600">⚡ 例外として乗車許可</button>
        </div>`;
      }else if(!full){
        h+=`<button onclick="doCheckIn('${code}',${m.id})" style="width:100%;background:${cfg.bg};border:2px solid ${cfg.bd};border-radius:10px;padding:14px;margin-bottom:8px;text-align:left;display:flex;align-items:center;gap:12px">
          <div style="flex:1">
            <div style="font-size:20px;font-weight:700;color:${cfg.dk}">${esc(m.real_name)}</div>

          </div>

        </div>`;

  h+=`</div><div style="height:2rem"></div></div>`;

/* ===== HISTORY ===== */
function scrHistory(){
  const code=S.ht,cfg=STN[code],stn=getStn(code);
  const rIds=stnRoster(code),ciIds=stnCI(code);
  const boarded=rIds.filter(id=>ciIds.includes(id));
  const missed=rIds.filter(id=>!ciIds.includes(id));
  const wrongPpl=missed.filter(id=>getCI(id)!==undefined);
  const noShow=missed.filter(id=>getCI(id)===undefined);

  const card=(id,type)=>{
    const m=getStaff(id),ci=getCI(id);if(!m)return'';
    if(type==='wrong'&&ci){
      const wCfg=STN[ci.station_code]||STN.A;
      return`<div style="padding:10px 0;border-bottom:1px solid rgba(245,166,35,.25)">
        <div style="font-size:15px;font-weight:600;color:#1a1a1a">${esc(m.real_name)}</div>
        ${m.facebook_name?`<div style="font-size:12px;color:#A0650A">fb: ${esc(m.facebook_name)}</div>`:''}
        <div style="font-size:12px;color:#A0650A;margin-top:2px">→ ${wCfg.emoji} ${esc(getStn(ci.station_code).name)} で乗車</div>
      </div>`;
    }
    return`<div style="padding:10px 0;border-bottom:1px solid #f0f0ec${type==='noshow'?';opacity:.65':''}">
      <div style="font-size:15px;font-weight:500;color:${type==='noshow'?'#888':'#1a1a1a'}">${esc(m.real_name)}</div>
      ${m.facebook_name?`<div style="font-size:12px;color:${type==='noshow'?'#bbb':'#aaa'}">fb: ${esc(m.facebook_name)}</div>`:''}
    </div>`;
  };

  let h=`<div>
    <div style="background:${cfg.bg};padding:1rem 1.1rem 0.875rem;border-bottom:1px solid ${cfg.bd}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <button class="bk" onclick="set({screen:'board',as:'${code}',boardSrch:''})" style="color:${cfg.tx}">←</button>
        <span style="font-size:17px;font-weight:700;color:${cfg.dk};flex:1">${cfg.emoji} ${esc(stn.name)}</span>
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;background:${cfg.bg};border:1px solid ${cfg.bd};border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:${cfg.tx};font-weight:700">✅ 乗車済み</div>
          <div style="font-size:22px;font-weight:800;color:${cfg.dk}">${boarded.length}</div>
        </div>
        <div style="flex:1;background:#FFF8E6;border:1px solid #F5A623;border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:#A0650A;font-weight:700">⚠️ 誤乗車</div>
          <div style="font-size:22px;font-weight:800;color:#A0650A">${wrongPpl.length}</div>
        </div>
        <div style="flex:1;background:#f5f5f0;border:1px solid #ddd;border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:#888;font-weight:700">❌ 未乗車</div>
          <div style="font-size:22px;font-weight:800;color:#888">${noShow.length}</div>
        </div>
      </div>
    </div>
    <div style="padding:1rem">`;

  if(boarded.length>0){h+=`<div style="font-size:10px;color:#3B6D11;letter-spacing:.5px;font-weight:700;margin-bottom:6px">✅ 乗車済み (${boarded.length}名)</div>`;boarded.forEach(id=>{h+=card(id,'boarded');});}
  if(wrongPpl.length>0){
    h+=`<div style="font-size:10px;color:#A0650A;letter-spacing:.5px;font-weight:700;margin:14px 0 4px">⚠️ 誤ステーションで乗車 (${wrongPpl.length}名)</div>
      <div style="background:#FFF8E6;border:1px solid #F5A623;border-radius:10px;padding:0 10px;margin-bottom:4px">`;
    wrongPpl.forEach(id=>{h+=card(id,'wrong');});h+=`</div>`;
  }
  if(noShow.length>0){
    h+=`<div style="font-size:10px;color:#888;letter-spacing:.5px;font-weight:700;margin:14px 0 4px">❌ 未乗車 (${noShow.length}名)</div>
      <div style="background:#f5f5f0;border:1px solid #e0e0dc;border-radius:10px;padding:0 10px;margin-bottom:4px">`;
    noShow.forEach(id=>{h+=card(id,'noshow');});h+=`</div>`;
  }
  if(rIds.length===0)h+=`<p style="color:#ccc;font-size:13px;text-align:center;padding:2rem">本日このステーションにスタッフが割り当てられていません。</p>`;

  h+=`</div><div style="padding:0 1rem 2.5rem">
    <button onclick="resetCI('${code}')" style="width:100%;padding:11px;border-radius:9px;border:1px solid #ddd;background:#f7f7f5;font-size:13px;color:#888">🔄 このステーションのチェックインをリセット</button>
  </div></div>`;
  return h;
}

function scrReport(){
  let tB=0,tS=0,tW=0,tN=0;
  let h=`<div>
    <div style="padding:1rem 1.1rem 0.875rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e8e8e4">

      </div>
      <button onclick="exportCSV()" style="background:#555;border:none;border-radius:8px;padding:8px 10px;color:white;font-size:12px;font-weight:700">⬇️ CSV</button>
    </div>
    <div style="padding:10px 1rem;background:#f7f7f5;border-bottom:1px solid #e8e8e4;display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600;color:#1a1a1a">Google Sheets に送信</div>

      </div>
      <button onclick="pushToSheets()" style="padding:8px 14px;border-radius:8px;border:none;background:${S.pushing?'#aaa':'#217346'};color:white;font-size:13px;font-weight:700;white-space:nowrap" ${S.pushing?'disabled':''}>
        ${S.pushing?'送信中...':'📤 送信'}
      </button>
    </div>`;

  CODES.forEach(code=>{
    const cfg=STN[code],stn=getStn(code);
    const rIds=stnRoster(code),ciIds=stnCI(code);
    const boarded=rIds.filter(id=>ciIds.includes(id));
    const missed=rIds.filter(id=>!ciIds.includes(id));
    const wrongSt=missed.filter(id=>getCI(id)!==undefined);
    const noShow=missed.filter(id=>getCI(id)===undefined);
    tB+=boarded.length;tS+=rIds.length;tW+=wrongSt.length;tN+=noShow.length;

    h+=`<div style="padding:1rem;border-bottom:1px solid #f0f0ec">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <span style="font-size:15px;font-weight:700;color:${cfg.dk}">${cfg.emoji} ${esc(stn.name)}</span>
        <span style="font-size:15px;font-weight:700;color:${cfg.dk}">${boarded.length}/${rIds.length}</span>
      </div>`;

    if(boarded.length>0){
      h+=`<div style="font-size:10px;color:#3B6D11;font-weight:700;margin-bottom:6px">✅ 乗車済み (${boarded.length}名)</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">`;
      boarded.forEach(id=>{const m=getStaff(id);if(m)h+=`<span style="background:${cfg.bg};border:1px solid ${cfg.bd};padding:5px 10px;border-radius:20px;font-size:12px;color:${cfg.dk};font-weight:600">${esc(m.real_name)}</span>`;});
      h+=`</div>`;
    }
    if(wrongSt.length>0){
      h+=`<div style="font-size:10px;color:#A0650A;font-weight:700;margin-bottom:6px">⚠️ 誤ステーション (${wrongSt.length}名)</div>`;
      wrongSt.forEach(id=>{
        const m=getStaff(id),ci=getCI(id);if(!m||!ci)return;
        const wCfg=STN[ci.station_code]||STN.A;
        h+=`<div style="background:#FFF8E6;border:1px solid #F5A623;border-radius:8px;padding:7px 10px;margin-bottom:5px;font-size:13px">
          <b>${esc(m.real_name)}</b>${m.facebook_name?` · fb: ${esc(m.facebook_name)}`:''} → ${wCfg.emoji} ${esc(getStn(ci.station_code).name)}
        </div>`;
      });
    }
    if(noShow.length>0){
      h+=`<div style="font-size:10px;color:#888;font-weight:700;margin-bottom:6px">❌ 未乗車 (${noShow.length}名)</div><div style="display:flex;flex-wrap:wrap;gap:5px">`;
      noShow.forEach(id=>{const m=getStaff(id);if(m)h+=`<span style="background:#f5f5f0;border:1px solid #e0e0dc;padding:5px 10px;border-radius:20px;font-size:12px;color:#888">${esc(m.real_name)}${m.facebook_name?' · '+esc(m.facebook_name):''}</span>`;});
      h+=`</div>`;
    }
    if(rIds.length===0)h+=`<p style="color:#ccc;font-size:13px">本日割り当てなし</p>`;
    h+=`</div>`;
  });

  h+=`<div style="padding:1rem 1rem 3rem">
    <div style="background:#f7f7f5;border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:10px">
      <div style="font-size:11px;color:#aaa;font-weight:700;letter-spacing:.5px">本日の合計乗車人数</div>
      <div style="font-size:52px;font-weight:800;color:#1a1a1a;line-height:1.1">${tB}</div>
      <div style="font-size:13px;color:#aaa">${tS}名中</div>
    </div>
    <div style="display:flex;gap:8px">
      <div style="flex:1;background:#FFF8E6;border:1px solid #F5A623;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#A0650A;font-weight:700">⚠️ 誤乗車</div>
        <div style="font-size:24px;font-weight:800;color:#A0650A">${tW}</div>
      </div>
      <div style="flex:1;background:#f5f5f0;border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:#888;font-weight:700">❌ 未乗車</div>
        <div style="font-size:24px;font-weight:800;color:#888">${tN}</div>
      </div>
    </div>
  </div></div>`;
  return h;
}

/* ===== RENDER ===== */
function render(){
  const app=document.getElementById('app');
  switch(S.screen){
    case 'loading': app.innerHTML='<div style="padding:4rem;text-align:center;color:#aaa"><div style="font-size:40px;margin-bottom:1rem">🚌</div><div>接続中...</div></div>'; break;
    case 'error':   app.innerHTML='<div style="padding:3rem;text-align:center"><div style="font-size:36px;margin-bottom:1rem">⚠️</div><div style="font-size:16px;color:#A32D2D;margin-bottom:1rem">接続できませんでした</div><button onclick="loadAll()" style="padding:10px 20px;border-radius:8px;border:none;background:#1a1a1a;color:white;font-size:14px">再試行</button></div>'; break;
    case 'home':    app.innerHTML=scrHome();    break;
    case 'board':   app.innerHTML=scrBoard();   break;
    case 'history': app.innerHTML=scrHistory(); break;
    case 'report':  app.innerHTML=scrReport();  break;
    case 'admin':   app.innerHTML=scrAdmin();   break;
    default:        app.innerHTML=scrHome();
  }
  if(S.toast){
    const t=document.createElement('div');t.className='toast';t.textContent=S.toast;document.body.appendChild(t);
  }else{
    document.querySelectorAll('.toast').forEach(t=>t.remove());
  }
  // Auto-focus search box on board screen
  if(S.screen==='board'){const el=document.getElementById('bsrch');if(el)setTimeout(()=>el.focus(),100);}
}

loadAll();
</script>
</body>
</html>
