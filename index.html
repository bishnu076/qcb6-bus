const SKEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmZ2FocWpheXJ2cmhnZWJkbWR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzQwNjQsImV4cCI6MjA5NTIxMDA2NH0.XJCYWDIDxdtZxMW1Y9GwkJKhEdRhGylfui-h544d3zs';

const ROSTER_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${ROSTER_GID}`;

let S={

/* ===== UTILS ===== */
function today(){return new Date().toISOString().slice(0,10);}
function todayLbl(){return new Date().toLocaleDateString('en-JP',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function set(p){Object.assign(S,p);render();}
function toast(msg,ms=3000){
  if(S.toastTimer)clearTimeout(S.toastTimer);
  S.toast=msg;
  S.toastTimer=setTimeout(()=>{S.toast='';render();},ms);
  render();
}
function parseCSV(text){
  const r=Papa.parse(text.replace(/^\uFEFF/,''),{header:true,skipEmptyLines:true});
  return r.data||[];
}

/* ===== SUPABASE DATA ===== */
async function reloadCI(){const{data}=await sb.from('checkins').select('*').eq('shift_date',today());S.data.checkins=data||[];}
async function reloadRoster(){const{data}=await sb.from('roster').select('*').eq('shift_date',today());S.data.roster=data||[];}
async function reloadStaff(){const{data}=await sb.from('staff').select('*').order('badge_number');S.data.staff=data||[];}

async function loadAll(){
  S.screen='loading';render();
  try{
    const[st,sf,ro,ci]=await Promise.all([
      sb.from('stations').select('*').order('code'),
      sb.from('staff').select('*').order('badge_number'),
      sb.from('roster').select('*').eq('shift_date',today()),
      sb.from('checkins').select('*').eq('shift_date',today())
    ]);
    S.data.stations=st.data||[];
    S.data.staff=sf.data||[];
    S.data.roster=ro.data||[];
    S.data.checkins=ci.data||[];
    S.screen='home';
  }catch(e){S.screen='error';}
  render();
  subscribe();
}

function subscribe(){
  sb.channel('qcb6_live')
    .on('postgres_changes',{event:'*',schema:'public',table:'checkins'},async()=>{await reloadCI();render();})
    .on('postgres_changes',{event:'*',schema:'public',table:'roster'},async()=>{await reloadRoster();render();})
    .on('postgres_changes',{event:'*',schema:'public',table:'staff'},async()=>{await reloadStaff();render();})
    .subscribe();
}

/* ===== GOOGLE SHEETS SYNC ===== */
async function syncFromSheets(){
  S.syncing=true;toast('📥 Syncing from Google Sheets...',10000);render();
  try{
    // --- Fetch Staff ---
    const staffRes=await fetch(STAFF_CSV);
    const staffText=await staffRes.text();
    const staffRows=parseCSV(staffText);

    let staffAdded=0,staffUpdated=0;
    for(const row of staffRows){
      const badge=parseInt(row['Badge No']||row['badge no']||row['Badge']||'');
      const rn=(row['Real Name']||row['real name']||row['Name']||'').trim();
      const fb=(row['Facebook Name']||row['facebook name']||row['Facebook']||'').trim();
      if(!badge||!rn)continue;
      const existing=S.data.staff.find(s=>s.badge_number===badge);
      if(existing){
        await sb.from('staff').update({real_name:rn,facebook_name:fb}).eq('id',existing.id);
        staffUpdated++;
      }else{
        await sb.from('staff').insert({badge_number:badge,real_name:rn,facebook_name:fb});
        staffAdded++;
      }
    }
    await reloadStaff();

    // --- Fetch Roster ---
    const rosterRes=await fetch(ROSTER_CSV);
    const rosterText=await rosterRes.text();
    const rosterRows=parseCSV(rosterText);

    // Clear today's roster first
    const existingRIds=S.data.roster.map(r=>r.id);
    if(existingRIds.length>0)await sb.from('roster').delete().in('id',existingRIds);

    let rosterCount=0;
    for(const row of rosterRows){
      const badge=parseInt(row['Badge No']||row['badge no']||row['Badge']||'');
      const stn=(row['Station']||row['station']||'').trim().toUpperCase();
      if(!badge||!['A','B','C'].includes(stn))continue;
      const staff=S.data.staff.find(s=>s.badge_number===badge);
      if(!staff)continue;
      await sb.from('roster').insert({shift_date:today(),staff_id:staff.id,station_code:stn});
      rosterCount++;
    }
    await reloadRoster();

    const msg=`✅ Synced! ${staffRows.length} staff, ${rosterCount} in today's roster`;
    S.lastSync=new Date().toLocaleTimeString();
    toast(msg,4000);
  }catch(e){
    toast('❌ Sync failed — check sheet is set to public: '+e.message,5000);
  }
  S.syncing=false;render();
}

/* ===== PUSH TO GOOGLE SHEETS ===== */
async function pushToSheets(){
  S.pushing=true;toast('📤 Pushing report to Google Sheets...',10000);render();
  try{
    // Boarding log
    const boardingLog=S.data.checkins.map(ci=>{
      const m=getStaff(ci.staff_id);
      return{badge:m?.badge_number||'',realName:m?.real_name||'',facebook:m?.facebook_name||'',station:getStn(ci.station_code).name,time:new Date(ci.checked_in_at).toLocaleTimeString()};
    });

    // Exceptions
    const exceptions=[];
    ['A','B','C'].forEach(s=>{
      const rIds=stnRoster(s),ciIds=stnCI(s);
      rIds.filter(id=>!ciIds.includes(id)).forEach(id=>{
        const m=getStaff(id),ci=getCI(id);
        exceptions.push({badge:m?.badge_number||'',realName:m?.real_name||'',facebook:m?.facebook_name||'',assigned:getStn(s).name,boardedAt:ci?getStn(ci.station_code).name:'',type:ci?'Wrong Station':'No Show'});
      });
    });

    // Summary
    const summary={
      aB:stnCI('A').length,aA:stnRoster('A').length,
      bB:stnCI('B').length,bA:stnRoster('B').length,
      cB:stnCI('C').length,cA:stnRoster('C').length,
      total:S.data.checkins.length,
      wrong:exceptions.filter(e=>e.type==='Wrong Station').length,
      noShow:exceptions.filter(e=>e.type==='No Show').length
    };

    await fetch(SCRIPT_URL,{
      method:'POST',
      mode:'no-cors',
      body:JSON.stringify({action:'push_report',date:today(),boardingLog,exceptions,summary})
    });

    toast('✅ Report pushed to Google Sheets!',4000);
  }catch(e){
    toast('❌ Push failed: '+e.message,5000);
  }
  S.pushing=false;render();
}

/* ===== SUPABASE ACTIONS ===== */
async function addStaff(){
  const rn=S.newRN.trim(),fb=S.newFB.trim();
  if(!rn)return;
  const maxB=S.data.staff.reduce((m,s)=>Math.max(m,s.badge_number),0);
  const{data,error}=await sb.from('staff').insert({badge_number:maxB+1,real_name:rn,facebook_name:fb}).select().single();
  if(!error&&data){S.data.staff.push(data);S.newRN='';S.newFB='';}
  render();
}
async function saveEdit(){
  const rn=S.editRN.trim(),fb=S.editFB.trim();if(!rn)return;
  await sb.from('staff').update({real_name:rn,facebook_name:fb}).eq('id',S.editId);
  const idx=S.data.staff.findIndex(s=>s.id===S.editId);
  if(idx>=0)S.data.staff[idx]={...S.data.staff[idx],real_name:rn,facebook_name:fb};
  S.editId=null;render();
}
async function removeStaff(id){
  if(!confirm('Remove this staff member?'))return;
  await sb.from('staff').delete().eq('id',id);
  S.data.staff=S.data.staff.filter(s=>s.id!==id);
  S.data.roster=S.data.roster.filter(r=>r.staff_id!==id);
  S.data.checkins=S.data.checkins.filter(c=>c.staff_id!==id);
  render();
}
async function assignStation(staffId,stnCode){
  const ex=S.data.roster.find(r=>r.staff_id===staffId);
  if(stnCode==='none'){
    if(ex){await sb.from('roster').delete().eq('id',ex.id);S.data.roster=S.data.roster.filter(r=>r.staff_id!==staffId);}
  }else if(ex){
    await sb.from('roster').update({station_code:stnCode}).eq('id',ex.id);
    const idx=S.data.roster.findIndex(r=>r.id===ex.id);
    if(idx>=0)S.data.roster[idx]={...ex,station_code:stnCode};
  }else{
    const{data}=await sb.from('roster').insert({shift_date:today(),staff_id:staffId,station_code:stnCode}).select().single();
    if(data)S.data.roster.push(data);
  }
  render();
}
async function doCheckIn(stnCode,staffId){
  const ex=S.data.checkins.find(c=>c.staff_id===staffId);
  if(ex){
    await sb.from('checkins').delete().eq('id',ex.id);
    S.data.checkins=S.data.checkins.filter(c=>c.id!==ex.id);
  }else{
    const{data}=await sb.from('checkins').insert({shift_date:today(),staff_id:staffId,station_code:stnCode}).select().single();
    if(data)S.data.checkins.push(data);
  }
  S.input='';render();
}
async function overrideCheckIn(stnCode,staffId,name){
  if(!confirm('Allow '+name+' to board here as an exception?'))return;
  await doCheckIn(stnCode,staffId);
}
async function resetCI(stnCode){
  const stn=getStn(stnCode);
  if(!confirm('Reset all check-ins for '+stn.name+'?'))return;
  const ids=S.data.checkins.filter(c=>c.station_code===stnCode).map(c=>c.id);
  if(ids.length>0)await sb.from('checkins').delete().in('id',ids);
  S.data.checkins=S.data.checkins.filter(c=>c.station_code!==stnCode);
  render();
}
async function updateStn(code){
  const n=document.getElementById('sn'+code),l=document.getElementById('sl'+code);
  if(!n||!l)return;
  const name=n.value,limit=parseInt(l.value)||20;
  await sb.from('stations').update({name,seat_limit:limit}).eq('code',code);
  const idx=S.data.stations.findIndex(s=>s.code===code);
  if(idx>=0)S.data.stations[idx]={...S.data.stations[idx],name,seat_limit:limit};
  toast('✅ Saved',1500);render();
}

/* ===== HELPERS ===== */
function getStn(code){return S.data.stations.find(s=>s.code===code)||{code,name:'Station '+code,seat_limit:20};}
function getStaff(id){return S.data.staff.find(s=>s.id===id);}
function getRosterStn(staffId){const r=S.data.roster.find(r=>r.staff_id===staffId);return r?r.station_code:null;}
function getCI(staffId){return S.data.checkins.find(c=>c.staff_id===staffId);}
function stnRoster(code){return S.data.roster.filter(r=>r.station_code===code).map(r=>r.staff_id);}
function stnCI(code){return S.data.checkins.filter(c=>c.station_code===code).map(c=>c.staff_id);}

function exportCSV(){
  let rows=['Badge No,Real Name,Facebook Name,Assigned Station,Boarded,Boarded At,Time'];
  S.data.staff.forEach(m=>{
    const a=getRosterStn(m.id),ci=getCI(m.id);
    rows.push([m.badge_number,m.real_name,m.facebook_name||'',a?getStn(a).name:'Not assigned',ci?'YES':'NO',ci?getStn(ci.station_code).name:'',ci?new Date(ci.checked_in_at).toLocaleTimeString():''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='QCB6_'+today()+'.csv';a.click();
}

function numPad(){
  let h='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 1.1rem">';
  [1,2,3,4,5,6,7,8,9,'✕',0,'⌫'].forEach(k=>{
    if(k==='✕')h+=`<button onclick="set({input:''})" style="height:62px;border-radius:12px;border:1.5px solid #ddd;background:#f7f7f5;font-size:20px;color:#888">✕</button>`;
    else if(k==='⌫')h+=`<button onclick="set({input:S.input.slice(0,-1)})" style="height:62px;border-radius:12px;border:1.5px solid #ddd;background:#f7f7f5;font-size:22px;color:#555">⌫</button>`;
    else h+=`<button onclick="set({input:S.input+'${k}'})" style="height:62px;border-radius:12px;border:1.5px solid #ddd;background:#fff;font-size:24px;font-weight:700;color:#1a1a1a">${k}</button>`;
  });
  return h+'</div>';
}

function scrError(){return`<div style="padding:3rem;text-align:center"><div style="font-size:36px;margin-bottom:1rem">⚠️</div><div style="font-size:16px;color:#A32D2D;margin-bottom:1rem">Could not connect</div><button onclick="loadAll()" style="padding:10px 20px;border-radius:8px;border:none;background:#1a1a1a;color:white;font-size:14px">Retry</button></div>`;}

    </div>`;

  if(!rSet){
    h+=`<div style="background:#FFF8E6;border:2px solid #F5A623;border-radius:12px;padding:1rem;margin-bottom:14px">
      <div style="font-size:14px;font-weight:700;color:#A0650A;margin-bottom:4px">⚠️ Today's roster not set</div>

      <button onclick="set({screen:'roster',rSrch:''})" style="background:none;border:1px solid #639922;border-radius:6px;padding:4px 10px;font-size:12px;color:#3B6D11">Edit</button>

  }

  ['A','B','C'].forEach(s=>{

function scrBoard(){
  const s=S.as,col=COL[s],stn=getStn(s);
  const ciIds=stnCI(s),cnt=ciIds.length,rem=stn.seat_limit-cnt,full=rem<=0;
  const rIds=stnRoster(s),inp=S.input;
  const match=inp?S.data.staff.find(m=>String(m.badge_number)===inp):null;
  const inRoster=match&&rIds.includes(match.id);
  const exCI=match?getCI(match.id):null;
  const alreadyHere=exCI&&exCI.station_code===s;
  const boardedElse=exCI&&exCI.station_code!==s;
  const assignedTo=match?getRosterStn(match.id):null;
  const wrongStn=match&&!inRoster&&assignedTo&&assignedTo!==s;
  const notSched=match&&!inRoster&&!assignedTo;

  let h=`<div>
    <div style="background:${col.bd};padding:1rem 1.1rem 0.9rem">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <button class="bk" onclick="set({screen:'home',input:''})" style="color:white">←</button>
        <span style="font-size:17px;font-weight:700;color:white;flex:1">${esc(stn.name)}</span>
        <button onclick="set({screen:'history',ht:'${s}'})" style="background:rgba(255,255,255,.2);border:none;border-radius:7px;padding:6px 10px;color:white;font-size:12px;font-weight:600">👥 Status</button>
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;background:rgba(255,255,255,.18);border-radius:10px;padding:8px 11px">
          <div style="font-size:9px;color:rgba(255,255,255,.7);letter-spacing:.7px;font-weight:700">BOARDED</div>
          <div style="font-size:28px;font-weight:800;color:white;line-height:1.1">${cnt}</div>

function scrHistory(){

        ${m.facebook_name?`<div style="font-size:12px;color:${type==='noshow'?'#bbb':'#aaa'}">fb: ${esc(m.facebook_name)}</div>`:''}

  let h=`<div>
    <div style="background:${col.bg};padding:1rem 1.1rem 0.875rem;border-bottom:1px solid ${col.bd}">

        <span style="font-size:17px;font-weight:700;color:${col.dk};flex:1">${esc(stn.name)} — Status</span>
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;background:${col.bg};border:1px solid ${col.bd};border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:${col.tx};font-weight:700">✅ BOARDED</div>
          <div style="font-size:22px;font-weight:800;color:${col.dk}">${boarded.length}</div>
        </div>
        <div style="flex:1;background:#FFF8E6;border:1px solid #F5A623;border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:#A0650A;font-weight:700">⚠️ WRONG BUS</div>
          <div style="font-size:22px;font-weight:800;color:#A0650A">${wrongPpl.length}</div>

  if(wrongPpl.length>0){

  h+=`</div><div style="padding:0 1rem 2.5rem"><button onclick="resetCI('${s}')" style="width:100%;padding:11px;border-radius:9px;border:1px solid #ddd;background:#f7f7f5;font-size:13px;color:#888">🔄 Reset check-ins for this station</button></div></div>`;

    h+=`<div style="border:1px solid #e8e8e4;border-radius:10px;overflow:hidden">`;
    filtered.forEach((m,i)=>{
      const asgn=getRosterStn(m.id),isEdit=S.editId===m.id;
      if(isEdit){
        h+=`<div style="padding:12px;background:#f7f7f5;${i<filtered.length-1?'border-bottom:1px solid #e0e0dc':''}">
          <div style="font-size:11px;color:#888;font-weight:700;margin-bottom:6px">EDITING #${m.badge_number}</div>
          <input type="text" value="${esc(S.editRN)}" oninput="S.editRN=this.value" placeholder="Real name" style="margin-bottom:6px" />
          <input type="text" value="${esc(S.editFB)}" oninput="S.editFB=this.value" placeholder="Facebook name" style="margin-bottom:8px" />
          <div style="display:flex;gap:6px">
            <button onclick="saveEdit()" style="flex:2;padding:9px;border-radius:7px;border:none;background:#1a1a1a;color:white;font-size:14px;font-weight:700">Save</button>
            <button onclick="set({editId:null})" style="flex:1;padding:9px;border-radius:7px;border:1px solid #ddd;background:#f5f5f0;color:#666;font-size:13px">Cancel</button>
          </div>
        </div>`;
      }else{
        h+=`<div style="display:flex;align-items:center;padding:10px 12px;${i<filtered.length-1?'border-bottom:1px solid #f0f0ec':''}">
          <div style="width:32px;height:32px;border-radius:7px;background:${asgn?COL[asgn].bd:'#ddd'};display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:10px">
            <span style="color:white;font-size:12px;font-weight:800">${m.badge_number}</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;color:#1a1a1a;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.real_name)}</div>
            <div style="font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.facebook_name?'fb: '+esc(m.facebook_name):'<span style="color:#ddd">no facebook name</span>'}</div>
          </div>
          ${asgn?`<span style="font-size:10px;color:${COL[asgn].tx};background:${COL[asgn].bg};padding:2px 5px;border-radius:4px;border:1px solid ${COL[asgn].bd};margin:0 5px;white-space:nowrap">${COL[asgn].lbl}</span>`:''}
          <button onclick="set({editId:${m.id},editRN:'${m.real_name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',editFB:'${(m.facebook_name||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}'})" style="background:none;border:none;font-size:17px;padding:3px 4px;color:#aaa">✏️</button>
          <button onclick="removeStaff(${m.id})" style="background:none;border:none;font-size:17px;padding:3px 4px;color:#E24B4A">🗑</button>
        </div>`;
      }
    });
    h+=`</div>`;
  }
  h+=`</div><div style="padding:0 1rem 3rem"><button onclick="set({screen:'roster',rSrch:''})" style="width:100%;padding:12px;border-radius:9px;border:none;background:#1a1a1a;color:white;font-size:14px;font-weight:700">📋 Set Today's Roster →</button></div></div>`;
  return h;
}

function scrRoster(){
  const srch=S.rSrch.toLowerCase();
  const filtered=S.data.staff.filter(m=>m.real_name.toLowerCase().includes(srch)||String(m.badge_number).includes(srch)||(m.facebook_name||'').toLowerCase().includes(srch));
  let h=`<div>
    <div style="padding:1rem 1.1rem 0.875rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e8e8e4;background:#fff;position:sticky;top:0;z-index:10">
      <button class="bk" onclick="set({screen:'home'})">←</button>
      <div style="flex:1">
        <div style="font-size:17px;font-weight:700;color:#1a1a1a">Today's Roster</div>
        <div style="font-size:12px;color:#aaa">${todayLbl()} · ${S.data.roster.length} assigned</div>
      </div>
      <button onclick="set({screen:'home'})" style="background:#1a1a1a;border:none;border-radius:8px;padding:8px 14px;color:white;font-size:13px;font-weight:700">Done ✓</button>
    </div>
    <div style="display:flex;gap:6px;padding:10px 1rem;background:#f7f7f5;border-bottom:1px solid #e8e8e4">`;

  ['A','B','C'].forEach(s=>{
    const col=COL[s],cnt=stnRoster(s).length;
    h+=`<div style="flex:1;background:${col.bg};border:1px solid ${col.bd};border-radius:8px;padding:7px;text-align:center">
      <div style="font-size:10px;color:${col.tx};font-weight:700">${esc(getStn(s).name)}</div>
      <div style="font-size:20px;font-weight:800;color:${col.dk}">${cnt}</div>
    </div>`;
  });

  h+=`</div>
    <div style="padding:10px 1rem">
      <input type="text" placeholder="🔍 Search by name, badge no, or Facebook name..." value="${esc(S.rSrch)}" oninput="set({rSrch:this.value})" style="background:#f7f7f5;border:1px solid #e0e0dc" />
    </div>
    <div style="padding:0 1rem">`;

  if(S.data.staff.length===0){
    h+=`<div style="text-align:center;padding:3rem 1rem;color:#bbb;font-size:14px">No staff yet.<br>Sync from Google Sheets first.</div>`;
  }else if(filtered.length===0){
    h+=`<div style="text-align:center;padding:2rem 1rem;color:#bbb;font-size:14px">No results</div>`;
  }else{
    filtered.forEach(m=>{
      const asgn=getRosterStn(m.id);
      h+=`<div style="padding:11px 0;border-bottom:1px solid #f0f0ec">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div style="width:32px;height:32px;border-radius:8px;background:${asgn?COL[asgn].bd:'#ddd'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <span style="color:white;font-size:12px;font-weight:800">${m.badge_number}</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:600;color:#1a1a1a">${esc(m.real_name)}</div>
            ${m.facebook_name?`<div style="font-size:12px;color:#aaa">fb: ${esc(m.facebook_name)}</div>`:''}
          </div>
          ${asgn?`<span style="font-size:11px;color:${COL[asgn].tx};background:${COL[asgn].bg};padding:2px 7px;border-radius:4px;border:1px solid ${COL[asgn].bd};font-weight:700;white-space:nowrap">${COL[asgn].lbl}</span>`:'<span style="font-size:12px;color:#bbb">Off</span>'}
        </div>
        <div style="display:flex;gap:5px">
          ${['A','B','C'].map(s=>{const col=COL[s],active=asgn===s;return`<button onclick="assignStation(${m.id},'${s}')" style="flex:1;padding:7px 3px;border-radius:8px;border:${active?`2px solid ${col.bd}`:`1px solid ${col.bd}`};background:${active?col.bd:col.bg};color:${active?'white':col.dk};font-size:11px;font-weight:${active?700:500}">${active?'✓ ':''}${esc(getStn(s).name)}</button>`;}).join('')}
          <button onclick="assignStation(${m.id},'none')" style="flex:1;padding:7px 3px;border-radius:8px;border:1px solid #ddd;background:${!asgn?'#555':'#f5f5f0'};color:${!asgn?'white':'#aaa'};font-size:11px;font-weight:${!asgn?700:400}">${!asgn?'✓ ':''}Off</button>
        </div>
      </div>`;
    });
  }
  h+=`</div><div style="height:3rem"></div></div>`;
  return h;
}

/* ===== RENDER ===== */
function render(){
  const app=document.getElementById('app');
  switch(S.screen){
    case 'loading': app.innerHTML=scrLoading(); break;
    case 'error':   app.innerHTML=scrError();   break;
    case 'home':    app.innerHTML=scrHome();    break;
    case 'board':   app.innerHTML=scrBoard();   break;
    case 'history': app.innerHTML=scrHistory(); break;
    case 'report':  app.innerHTML=scrReport();  break;
    case 'admin':   app.innerHTML=scrAdmin();   break;
    case 'roster':  app.innerHTML=scrRoster();  break;
    default:        app.innerHTML=scrHome();
  }
  // Toast overlay
  if(S.toast){
    const t=document.createElement('div');
    t.className='toast';t.textContent=S.toast;
    document.body.appendChild(t);
  }else{
    document.querySelectorAll('.toast').forEach(t=>t.remove());
  }
}

loadAll();
</script>
</body>
</html>
