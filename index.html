<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>QCB6 Bus Check-in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;min-height:100vh}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
input[type="text"],input[type="number"]{border:1px solid #ccc;border-radius:8px;padding:9px 13px;font-size:15px;font-family:inherit;width:100%;background:#fff;color:#1a1a1a}
input:focus{outline:none;border-color:#555}
button{font-family:inherit;cursor:pointer}
.bk{background:none;border:none;font-size:24px;padding:0;line-height:1;color:#666}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const SURL='https://rfgahqjayrvrhgebdmdw.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmZ2FocWpheXJ2cmhnZWJkbWR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzQwNjQsImV4cCI6MjA5NTIxMDA2NH0.XJCYWDIDxdtZxMW1Y9GwkJKhEdRhGylfui-h544d3zs';
const sb=supabase.createClient(SURL,SKEY);

const COL={
  A:{bg:'#FAECE7',bd:'#D85A30',tx:'#993C1D',dk:'#4A1B0C',lbl:'🔴 Red'},
  B:{bg:'#E6F1FB',bd:'#378ADD',tx:'#185FA5',dk:'#042C53',lbl:'🔵 Blue'},
  C:{bg:'#EAF3DE',bd:'#639922',tx:'#3B6D11',dk:'#173404',lbl:'🟢 Green'}
};

let S={
  screen:'loading',as:'A',at:'A',ht:'A',
  input:'',rSrch:'',sSrch:'',
  editId:null,editRN:'',editFB:'',
  newRN:'',newFB:'',
  data:{stations:[],staff:[],roster:[],checkins:[]}
};

function today(){return new Date().toISOString().slice(0,10);}
function todayLbl(){return new Date().toLocaleDateString('en-JP',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function set(p){Object.assign(S,p);render();}

/* ===== DATA ===== */
async function reloadCI(){const{data}=await sb.from('checkins').select('*').eq('shift_date',today());S.data.checkins=data||[];}
async function reloadRoster(){const{data}=await sb.from('roster').select('*').eq('shift_date',today());S.data.roster=data||[];}
async function reloadStaff(){const{data}=await sb.from('staff').select('*').order('badge_number');S.data.staff=data||[];}

async function loadAll(){
  S.screen='loading';render();
  try{
    const[st,sf,ro,ci]=await Promise.all([
      sb.from('stations').select('*').order('code'),
      sb.from('staff').select('*').order('badge_number'),
      sb.from('roster').select('*').eq('shift_date',today()),
      sb.from('checkins').select('*').eq('shift_date',today())
    ]);
    S.data.stations=st.data||[];
    S.data.staff=sf.data||[];
    S.data.roster=ro.data||[];
    S.data.checkins=ci.data||[];
    S.screen='home';
  }catch(e){S.screen='error';}
  render();
  subscribe();
}

function subscribe(){
  sb.channel('qcb6_live')
    .on('postgres_changes',{event:'*',schema:'public',table:'checkins'},async()=>{await reloadCI();render();})
    .on('postgres_changes',{event:'*',schema:'public',table:'roster'},async()=>{await reloadRoster();render();})
    .on('postgres_changes',{event:'*',schema:'public',table:'staff'},async()=>{await reloadStaff();render();})
    .subscribe();
}

/* ===== ACTIONS ===== */
async function addStaff(){
  const rn=S.newRN.trim(),fb=S.newFB.trim();
  if(!rn)return;
  const maxB=S.data.staff.reduce((m,s)=>Math.max(m,s.badge_number),0);
  const{data,error}=await sb.from('staff').insert({badge_number:maxB+1,real_name:rn,facebook_name:fb}).select().single();
  if(!error&&data){S.data.staff.push(data);S.newRN='';S.newFB='';}
  render();
}

async function saveEdit(){
  const rn=S.editRN.trim(),fb=S.editFB.trim();
  if(!rn)return;
  await sb.from('staff').update({real_name:rn,facebook_name:fb}).eq('id',S.editId);
  const idx=S.data.staff.findIndex(s=>s.id===S.editId);
  if(idx>=0)S.data.staff[idx]={...S.data.staff[idx],real_name:rn,facebook_name:fb};
  S.editId=null;render();
}

async function removeStaff(id){
  if(!confirm('Remove this staff member?'))return;
  await sb.from('staff').delete().eq('id',id);
  S.data.staff=S.data.staff.filter(s=>s.id!==id);
  S.data.roster=S.data.roster.filter(r=>r.staff_id!==id);
  S.data.checkins=S.data.checkins.filter(c=>c.staff_id!==id);
  render();
}

async function assignStation(staffId,stnCode){
  const existing=S.data.roster.find(r=>r.staff_id===staffId);
  if(stnCode==='none'){
    if(existing){await sb.from('roster').delete().eq('id',existing.id);S.data.roster=S.data.roster.filter(r=>r.staff_id!==staffId);}
  }else{
    if(existing){
      await sb.from('roster').update({station_code:stnCode}).eq('id',existing.id);
      const idx=S.data.roster.findIndex(r=>r.id===existing.id);
      if(idx>=0)S.data.roster[idx]={...existing,station_code:stnCode};
    }else{
      const{data}=await sb.from('roster').insert({shift_date:today(),staff_id:staffId,station_code:stnCode}).select().single();
      if(data)S.data.roster.push(data);
    }
  }
  render();
}

async function doCheckIn(stnCode,staffId){
  const existing=S.data.checkins.find(c=>c.staff_id===staffId);
  if(existing){
    await sb.from('checkins').delete().eq('id',existing.id);
    S.data.checkins=S.data.checkins.filter(c=>c.id!==existing.id);
  }else{
    const{data}=await sb.from('checkins').insert({shift_date:today(),staff_id:staffId,station_code:stnCode}).select().single();
    if(data)S.data.checkins.push(data);
  }
  S.input='';render();
}

async function overrideCheckIn(stnCode,staffId,name){
  if(!confirm('Allow '+name+' to board here as an exception?'))return;
  await doCheckIn(stnCode,staffId);
}

async function resetCI(stnCode){
  const stn=getStn(stnCode);
  if(!confirm('Reset all check-ins for '+stn.name+'?'))return;
  const ids=S.data.checkins.filter(c=>c.station_code===stnCode).map(c=>c.id);
  if(ids.length>0)await sb.from('checkins').delete().in('id',ids);
  S.data.checkins=S.data.checkins.filter(c=>c.station_code!==stnCode);
  render();
}

async function updateStn(code){
  const nameEl=document.getElementById('sn'+code),limEl=document.getElementById('sl'+code);
  if(!nameEl||!limEl)return;
  const name=nameEl.value,limit=parseInt(limEl.value)||20;
  await sb.from('stations').update({name,seat_limit:limit}).eq('code',code);
  const idx=S.data.stations.findIndex(s=>s.code===code);
  if(idx>=0)S.data.stations[idx]={...S.data.stations[idx],name,seat_limit:limit};
  render();
}

/* ===== HELPERS ===== */
function getStn(code){return S.data.stations.find(s=>s.code===code)||{code,name:'Station '+code,seat_limit:20};}
function getStaff(id){return S.data.staff.find(s=>s.id===id);}
function getRosterStn(staffId){const r=S.data.roster.find(r=>r.staff_id===staffId);return r?r.station_code:null;}
function getCI(staffId){return S.data.checkins.find(c=>c.staff_id===staffId);}
function stnRoster(code){return S.data.roster.filter(r=>r.station_code===code).map(r=>r.staff_id);}
function stnCI(code){return S.data.checkins.filter(c=>c.station_code===code).map(c=>c.staff_id);}

function exportCSV(){
  let rows=['Badge No,Real Name,Facebook Name,Assigned Station,Boarded,Boarded At Station,Time'];
  S.data.staff.forEach(m=>{
    const asgn=getRosterStn(m.id),ci=getCI(m.id);
    rows.push([
      m.badge_number,m.real_name,m.facebook_name||'',
      asgn?getStn(asgn).name:'Not assigned',
      ci?'YES':'NO',
      ci?getStn(ci.station_code).name:'',
      ci?new Date(ci.checked_in_at).toLocaleTimeString():''
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='QCB6_attendance_'+today()+'.csv';a.click();
}

function numPad(){
  let h='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 1.1rem">';
  [1,2,3,4,5,6,7,8,9,'✕',0,'⌫'].forEach(k=>{
    if(k==='✕')h+=`<button onclick="set({input:''})" style="height:62px;border-radius:12px;border:1.5px solid #ddd;background:#f7f7f5;font-size:20px;color:#888">✕</button>`;
    else if(k==='⌫')h+=`<button onclick="set({input:S.input.slice(0,-1)})" style="height:62px;border-radius:12px;border:1.5px solid #ddd;background:#f7f7f5;font-size:22px;color:#555">⌫</button>`;
    else h+=`<button onclick="set({input:S.input+'${k}'})" style="height:62px;border-radius:12px;border:1.5px solid #ddd;background:#fff;font-size:24px;font-weight:700;color:#1a1a1a">${k}</button>`;
  });
  return h+'</div>';
}

/* ===== SCREENS ===== */
function scrLoading(){
  return '<div style="padding:4rem;text-align:center;color:#aaa"><div style="font-size:40px;margin-bottom:1rem">🚌</div><div style="font-size:15px">Connecting to database...</div></div>';
}

function scrError(){
  return `<div style="padding:3rem;text-align:center">
    <div style="font-size:36px;margin-bottom:1rem">⚠️</div>
    <div style="font-size:16px;color:#A32D2D;margin-bottom:1rem">Could not connect to database</div>
    <button onclick="loadAll()" style="padding:10px 20px;border-radius:8px;border:none;background:#1a1a1a;color:white;font-size:14px">Retry</button>
  </div>`;
}

function scrHome(){
  const rSet=S.data.roster.length>0;
  const tot=S.data.checkins.length;
  let h=`<div style="padding:1.25rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h1 style="font-size:20px;font-weight:700;color:#1a1a1a">QCB6 Bus Check-in</h1>
      <button onclick="set({screen:'admin',sSrch:''})" style="background:none;border:1px solid #ddd;border-radius:8px;padding:7px 11px;font-size:13px;color:#666">⚙️ Setup</button>
    </div>
    <p style="font-size:12px;color:#aaa;margin-bottom:1rem">${todayLbl()}</p>`;

  if(!rSet){
    h+=`<div style="background:#FFF8E6;border:2px solid #F5A623;border-radius:12px;padding:1rem;margin-bottom:14px">
      <div style="font-size:14px;font-weight:700;color:#A0650A;margin-bottom:4px">⚠️ Today's roster not set yet</div>
      <div style="font-size:13px;color:#C17D20;margin-bottom:10px">Assign staff to stations before boarding starts.</div>
      <button onclick="set({screen:'roster',rSrch:''})" style="width:100%;padding:10px;border-radius:8px;border:none;background:#F5A623;color:white;font-size:14px;font-weight:700">Set Today's Roster →</button>
    </div>`;
  }else{
    h+=`<div style="background:#EAF3DE;border:1px solid #639922;border-radius:10px;padding:9px 12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:13px;color:#3B6D11;font-weight:600">✅ Roster set · ${S.data.roster.length} staff assigned · ${tot} boarded</div>
      <button onclick="set({screen:'roster',rSrch:''})" style="background:none;border:1px solid #639922;border-radius:6px;padding:4px 10px;font-size:12px;color:#3B6D11">Edit</button>
    </div>`;
  }

  ['A','B','C'].forEach(s=>{
    const col=COL[s],stn=getStn(s),cnt=stnCI(s).length,lim=stn.seat_limit,asgn=stnRoster(s).length;
    const full=cnt>=lim,pct=lim>0?Math.min(100,Math.round(cnt/lim*100)):0;
    h+=`<button onclick="set({screen:'board',as:'${s}',input:''})"
      style="width:100%;background:${col.bg};border:2px solid ${col.bd};border-radius:14px;padding:1rem 1.1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;text-align:left">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
          <span style="font-size:16px;font-weight:700;color:${col.dk}">${esc(stn.name)}</span>
          <span style="font-size:11px;color:${col.tx};background:white;padding:2px 7px;border-radius:4px;border:1px solid ${col.bd}">${col.lbl}</span>
        </div>
        <div style="font-size:12px;color:${col.tx}">${asgn} staff assigned today</div>
        <div style="height:5px;width:130px;background:rgba(0,0,0,0.1);border-radius:3px;margin-top:8px">
          <div style="height:5px;border-radius:3px;width:${pct}%;background:${full?'#E24B4A':col.bd}"></div>
        </div>
      </div>
      <div style="text-align:right;margin-left:12px">
        <div style="font-size:28px;font-weight:800;color:${full?'#A32D2D':col.dk};line-height:1">${cnt}/${lim}</div>
        <div style="font-size:11px;color:${full?'#A32D2D':col.tx};margin-top:2px">${full?'⚠ FULL':'tap to board'}</div>
      </div>
    </button>`;
  });

  h+=`<button onclick="set({screen:'report'})" style="width:100%;margin-top:4px;padding:11px;border-radius:9px;border:1px solid #ddd;background:#f7f7f5;font-size:13px;color:#555">📋 Attendance Report & Export CSV</button>
  </div>`;
  return h;
}

function scrBoard(){
  const s=S.as,col=COL[s],stn=getStn(s);
  const ciIds=stnCI(s),cnt=ciIds.length,rem=stn.seat_limit-cnt,full=rem<=0;
  const rIds=stnRoster(s),inp=S.input;
  const match=inp?S.data.staff.find(m=>String(m.badge_number)===inp):null;
  const inRoster=match&&rIds.includes(match.id);
  const existCI=match?getCI(match.id):null;
  const alreadyHere=existCI&&existCI.station_code===s;
  const boardedElsewhere=existCI&&existCI.station_code!==s;
  const assignedTo=match?getRosterStn(match.id):null;
  const wrongStn=match&&!inRoster&&assignedTo&&assignedTo!==s;
  const notScheduled=match&&!inRoster&&!assignedTo;

  let h=`<div>
    <div style="background:${col.bd};padding:1rem 1.1rem 0.9rem">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <button class="bk" onclick="set({screen:'home',input:''})" style="color:white">←</button>
        <span style="font-size:17px;font-weight:700;color:white;flex:1">${esc(stn.name)}</span>
        <button onclick="set({screen:'history',ht:'${s}'})" style="background:rgba(255,255,255,.2);border:none;border-radius:7px;padding:6px 10px;color:white;font-size:12px;font-weight:600">👥 Status</button>
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;background:rgba(255,255,255,.18);border-radius:10px;padding:8px 11px">
          <div style="font-size:9px;color:rgba(255,255,255,.7);letter-spacing:.7px;font-weight:700">BOARDED</div>
          <div style="font-size:28px;font-weight:800;color:white;line-height:1.1">${cnt}</div>
        </div>
        <div style="flex:1;background:${full?'#FCEBEB':'rgba(255,255,255,.18)'};border-radius:10px;padding:8px 11px">
          <div style="font-size:9px;color:${full?'#A32D2D':'rgba(255,255,255,.7)'};letter-spacing:.7px;font-weight:700">SEATS LEFT</div>
          <div style="font-size:28px;font-weight:800;color:${full?'#A32D2D':'white'};line-height:1.1">${rem}</div>
        </div>
        <div style="flex:1;background:rgba(255,255,255,.18);border-radius:10px;padding:8px 11px">
          <div style="font-size:9px;color:rgba(255,255,255,.7);letter-spacing:.7px;font-weight:700">ASSIGNED</div>
          <div style="font-size:28px;font-weight:800;color:white;line-height:1.1">${rIds.length}</div>
        </div>
      </div>
      ${full?'<div style="margin-top:9px;background:#FCEBEB;border-radius:8px;padding:9px;text-align:center;font-size:14px;color:#A32D2D;font-weight:800">⚠️ BUS IS FULL — Stop boarding!</div>':''}
    </div>

    <div style="padding:1rem 1.25rem 0.75rem;min-height:135px">
      <div style="font-size:11px;color:#aaa;letter-spacing:.5px;font-weight:700;margin-bottom:6px">BADGE NUMBER</div>
      <div style="font-size:52px;font-weight:800;letter-spacing:6px;line-height:1;min-height:60px;color:${inp?'#1a1a1a':'#e0e0dc'}">${inp||'—'}</div>`;

  if(inp){
    if(!match){
      h+=`<div style="margin-top:8px;background:#FCEBEB;border-radius:9px;padding:11px 14px;display:flex;align-items:center;gap:8px">
        <span style="font-size:20px">❓</span><span style="font-size:14px;color:#A32D2D;font-weight:600">Badge #${esc(inp)} not found in system</span>
      </div>`;
    }else if(boardedElsewhere){
      const wc=COL[existCI.station_code];
      h+=`<div style="margin-top:8px;background:#EAF3DE;border:1.5px solid #639922;border-radius:9px;padding:11px 14px">
        <div style="font-size:11px;color:#3B6D11;font-weight:700;margin-bottom:3px">✅ ALREADY BOARDED — different station</div>
        <div style="font-size:18px;font-weight:700;color:#1a1a1a">#${match.badge_number} — ${esc(match.real_name)}</div>
        ${match.facebook_name?`<div style="font-size:12px;color:#3B6D11;margin-top:2px">fb: ${esc(match.facebook_name)}</div>`:''}
        <div style="font-size:12px;color:#3B6D11;margin-top:5px">Boarded at <span style="background:${wc.bg};color:${wc.dk};padding:1px 7px;border-radius:3px;font-weight:700">${wc.lbl} — ${esc(getStn(existCI.station_code).name)}</span></div>
      </div>`;
    }else if(alreadyHere){
      h+=`<div style="margin-top:8px;background:#EAF3DE;border:1.5px solid #639922;border-radius:9px;padding:11px 14px">
        <div style="font-size:11px;color:#3B6D11;font-weight:700;margin-bottom:3px">✅ ALREADY BOARDED HERE</div>
        <div style="font-size:18px;font-weight:700;color:#1a1a1a">#${match.badge_number} — ${esc(match.real_name)}</div>
        ${match.facebook_name?`<div style="font-size:12px;color:#3B6D11;margin-top:2px">fb: ${esc(match.facebook_name)}</div>`:''}
        <button onclick="doCheckIn('${s}',${match.id})" style="margin-top:10px;width:100%;padding:10px;border-radius:8px;border:1.5px solid #639922;background:#f5f5f0;font-size:13px;color:#3B6D11;font-weight:600">↩ Undo check-in</button>
      </div>`;
    }else if(wrongStn){
      const oc=COL[assignedTo];
      h+=`<div style="margin-top:8px;background:#FFF8E6;border:1.5px solid #F5A623;border-radius:9px;padding:11px 14px">
        <div style="font-size:11px;color:#A0650A;font-weight:700;margin-bottom:3px">⚠️ WRONG STATION</div>
        <div style="font-size:18px;font-weight:700;color:#1a1a1a">#${match.badge_number} — ${esc(match.real_name)}</div>
        ${match.facebook_name?`<div style="font-size:12px;color:#A0650A;margin-top:2px">fb: ${esc(match.facebook_name)}</div>`:''}
        <div style="font-size:12px;color:#A0650A;margin-top:5px">Assigned to <span style="background:${oc.bg};color:${oc.dk};padding:1px 7px;border-radius:3px;font-weight:700">${oc.lbl} — ${esc(getStn(assignedTo).name)}</span></div>
        <button onclick="overrideCheckIn('${s}',${match.id},'${esc(match.real_name).replace(/'/g,"\\'")} ')" style="margin-top:10px;width:100%;padding:10px;border-radius:8px;border:1.5px solid #F5A623;background:#FFF8E6;font-size:13px;color:#A0650A;font-weight:600">⚡ Override — Allow exception</button>
      </div>`;
    }else if(notScheduled){
      h+=`<div style="margin-top:8px;background:#f5f5f0;border:1.5px solid #ddd;border-radius:9px;padding:11px 14px">
        <div style="font-size:11px;color:#888;font-weight:700;margin-bottom:3px">NOT IN TODAY'S ROSTER</div>
        <div style="font-size:18px;font-weight:700;color:#1a1a1a">#${match.badge_number} — ${esc(match.real_name)}</div>
        ${match.facebook_name?`<div style="font-size:12px;color:#aaa;margin-top:2px">fb: ${esc(match.facebook_name)}</div>`:''}
        <div style="font-size:12px;color:#aaa;margin-top:4px">Not scheduled for any station today.</div>
      </div>`;
    }else if(inRoster&&!full){
      h+=`<div style="margin-top:8px;background:${col.bg};border:2px solid ${col.bd};border-radius:10px;padding:12px 14px">
        <div style="font-size:11px;color:${col.tx};font-weight:700;margin-bottom:3px">FOUND ✓</div>
        <div style="font-size:21px;font-weight:700;color:${col.dk}">#${match.badge_number} — ${esc(match.real_name)}</div>
        ${match.facebook_name?`<div style="font-size:12px;color:${col.tx};margin-top:2px">fb: ${esc(match.facebook_name)}</div>`:''}

        <div style="display:flex;gap:5px">
          ${['A','B','C'].map(s=>{
            const col=COL[s],active=asgn===s;
            return `<button onclick="assignStation(${m.id},'${s}')" style="flex:1;padding:7px 3px;border-radius:8px;border:${active?`2px solid ${col.bd}`:`1px solid ${col.bd}`};background:${active?col.bd:col.bg};color:${active?'white':col.dk};font-size:11px;font-weight:${active?700:500}">${active?'✓ ':''}${esc(getStn(s).name)}</button>`;
          }).join('')}
          <button onclick="assignStation(${m.id},'none')" style="flex:1;padding:7px 3px;border-radius:8px;border:1px solid #ddd;background:${!asgn?'#555':'#f5f5f0'};color:${!asgn?'white':'#aaa'};font-size:11px;font-weight:${!asgn?700:400}">${!asgn?'✓ ':''}Off</button>
        </div>
      </div>`;
    });
  }

  h+=`</div><div style="height:3rem"></div></div>`;
  return h;
}

function render(){
  const app=document.getElementById('app');
  switch(S.screen){
    case 'loading': app.innerHTML=scrLoading(); break;
    case 'error': app.innerHTML=scrError(); break;
    case 'home': app.innerHTML=scrHome(); break;
    case 'board': app.innerHTML=scrBoard(); break;
    case 'history': app.innerHTML=scrHistory(); break;
    case 'report': app.innerHTML=scrReport(); break;
    case 'admin': app.innerHTML=scrAdmin(); break;
    case 'roster': app.innerHTML=scrRoster(); break;
    default: app.innerHTML=scrHome();
  }
}

loadAll();
</script>
</body>
